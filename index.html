  --accent:#63BCC4; --accent-ink:#0B1A1C; --accent-soft:#1D3C41; --gold:#E3B24A;
  --good:#6CC592; --good-soft:#193427; --mild:#E2C45A; --mild-soft:#35301A; --warn:#EE9A62; --warn-soft:#3A2618; --bad:#EE8189; --bad-soft:#3B1D21;
}
html{font-size:var(--fs)}
body{background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:1rem;line-height:1.75;padding-inline:16px;-webkit-text-size-adjust:100%}
h1,h2,h3,.disp{font-family:"Zen Maru Gothic","BIZ UDPGothic","Hiragino Maru Gothic ProN",sans-serif;text-wrap:balance;line-height:1.4;margin:0}
p{margin:0}
.wrap{max-width:780px;margin:0 auto;padding-block:0 72px}
button{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line);margin-bottom:20px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:1.1rem}
.brand-mark{width:1.9rem;height:1.9rem;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:.95rem}
.fsbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3rem .9rem;font-size:.85rem;cursor:pointer;min-height:2.4rem}
.top-btns{display:flex;flex-wrap:wrap;gap:8px;min-width:0;max-width:100%}
#whobtn{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fsbtn{flex:none;white-space:nowrap}
.who-card{display:grid;gap:12px}
.who-card.cur{border:2px solid var(--accent)}
.who-name{font-size:1.25rem;font-weight:700}
.who-edit{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.who-edit input{font:inherit;font-size:1.1rem;min-height:3.3rem;padding:.4rem .8rem;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);flex:1 1 10rem;min-width:0}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.nav button{white-space:nowrap;padding:0 4px;border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:3rem;font-weight:700;cursor:pointer;font-size:.95rem}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* common */
.hero{display:grid;gap:10px;margin-bottom:24px}
.hero h1{font-size:1.9rem}
.lead{color:var(--muted);max-width:36em}
.eyebrow{font-size:.85rem;letter-spacing:.08em;color:var(--accent);font-weight:700}
section{margin-top:32px;display:grid;gap:14px}
section > h2{font-size:1.3rem}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:12px}
.action{display:grid;gap:4px;text-align:left;padding:20px;border-radius:18px;border:2px solid var(--line);background:var(--surface);cursor:pointer;min-height:7rem;align-content:center}
.action.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.a-title{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:1.35rem}
.a-sub{font-size:.92rem;opacity:.85}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:12px}
.gcard{display:grid;gap:6px;text-align:left;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;align-content:start}
.gcard:hover{border-color:var(--accent)}
.gcard .g-name{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:1.2rem}
.tag{display:inline-block;justify-self:start;font-size:.78rem;padding:.05rem .6rem;border-radius:999px;background:var(--accent-soft);color:var(--ink);letter-spacing:.04em}
.gcard .g-desc{font-size:.92rem;color:var(--muted)}
.gcard .g-best{font-size:.85rem;color:var(--accent);font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.3rem;padding:.5rem 1.2rem;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1.1rem;font-weight:700;cursor:pointer;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);font-weight:400;font-size:.95rem;text-decoration:underline}
.btn.wide{width:100%;max-width:26rem;justify-self:center}
.btn:disabled{cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* task screens */
.task{display:grid;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px}
.task.center{text-align:center;justify-items:center}
.q{font-size:1.45rem}
.qsub{color:var(--muted);font-size:.95rem}
.prog{display:grid;gap:6px;margin-bottom:14px}
.prog-top{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;color:var(--muted)}
.prog-name{font-weight:700;color:var(--ink)}
.bar{height:10px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.bar.thin{height:6px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:10px}
.choices.grid4{grid-template-columns:repeat(auto-fill,minmax(5.6rem,1fr))}
.choices.grid2{grid-template-columns:repeat(2,1fr)}
.choice{min-height:3.6rem;font-size:1.2rem}
.choice.right{background:var(--good-soft);border-color:var(--good)}
.choice.wrong{background:var(--bad-soft);border-color:var(--bad)}
.quit{text-align:center;margin-top:14px}

.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(7rem,1fr));gap:10px}
.word{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:1.7rem;text-align:center;padding:18px 8px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.timer-line{display:grid;gap:6px;font-size:.92rem;color:var(--muted)}

.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.2rem,1fr));gap:8px}
.chip{min-height:3.3rem;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:1.15rem;font-weight:700;cursor:pointer;padding:.3rem .4rem}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.chip.on::before{content:"✓ ";color:var(--accent)}
.bottom-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.count{font-size:1rem;color:var(--muted)}
.count b{color:var(--ink);font-size:1.3rem;font-variant-numeric:tabular-nums}

.pad-display{display:flex;align-items:baseline;justify-content:center;gap:.4rem;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);min-height:4.2rem}
.pad-display #pd{font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.12em}
.pad-display .unit{font-size:1.2rem;color:var(--muted)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:20rem;justify-self:center}
.key{min-height:3.6rem;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1.6rem;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.key:active{background:var(--accent-soft)}
.key.sub{font-size:1rem;color:var(--muted)}
.key.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:1.1rem}

.flash{font-size:6rem;font-weight:700;min-height:9rem;min-width:9rem;display:grid;place-items:center;border-radius:24px;background:var(--surface2);border:2px solid var(--line);font-variant-numeric:tabular-nums;transition:opacity .15s;opacity:.25}
.flash.on{opacity:1}

.clock-wrap{display:grid;place-items:center}
.clock-wrap svg{width:min(15rem,70vw);height:auto}
.ck-face{fill:var(--surface2);stroke:var(--ink);stroke-width:4}
.ck-tick{stroke:var(--muted);stroke-width:1.5}
.ck-tick.big{stroke:var(--ink);stroke-width:3}
.ck-num{fill:var(--ink);font-family:"BIZ UDPGothic",sans-serif;font-weight:700;font-size:17px}
.ck-h{stroke:var(--ink);stroke-width:7;stroke-linecap:round}
.ck-m{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.ck-c{fill:var(--ink)}

.trail-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:1.05rem}
.trail-top b{font-size:1.5rem;color:var(--accent)}
.tnum{font-variant-numeric:tabular-nums;color:var(--muted)}
.board{position:relative;width:100%;max-width:30rem;aspect-ratio:1;justify-self:center;background:var(--surface2);border:1px solid var(--line);border-radius:16px}
.dot{position:absolute;transform:translate(-50%,-50%);width:15%;aspect-ratio:1;border-radius:50%;border:2px solid var(--ink);background:var(--surface);font-weight:700;font-size:1.25rem;cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.dot.done,.tcell.done{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);opacity:.55}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{translate:0}25%{translate:-6px}75%{translate:6px}}
.tgrid{display:grid;gap:8px;width:100%;max-width:28rem;justify-self:center}
.tcell{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:1.5rem;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;padding:0}

.pgrid{display:grid;gap:8px;width:100%;max-width:30rem;justify-self:center}
.pcard{aspect-ratio:3/4;border-radius:10px;border:2px solid #0F4F57;cursor:pointer;padding:0;position:relative;overflow:hidden;
  background:repeating-linear-gradient(45deg,#1D6B74 0 8px,#175A62 8px 16px)}
.pcard .face{position:absolute;inset:0;display:grid;place-items:center;font-family:"Zen Maru Gothic",serif;font-weight:700;font-size:1.9rem;background:#FBFAF6;opacity:0;transition:opacity .15s}
.pcard.up .face{opacity:1}
.pcard.got{border-color:#23794A}
.pcard.got .face{background:#E7F3EA}

.stroop-card{background:#FFFFFF;border:2px solid #C6D4D6;border-radius:18px;min-height:9rem;display:grid;place-items:center;font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:3.4rem;letter-spacing:.08em}
.sw{display:inline-block;width:1rem;height:1rem;border-radius:50%}
.fb{font-weight:700;min-height:1.6rem}
.fb.ok{color:var(--good)} .fb.ng{color:var(--bad)}
.calc-q{font-size:2.6rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}

.memo{justify-self:center;width:100%;max-width:22rem;background:#FFFDF3;color:#2A2A22;border-radius:6px;padding:18px 22px;box-shadow:0 2px 0 #E4DCBC,0 6px 14px rgba(0,0,0,.08);
  background-image:repeating-linear-gradient(#FFFDF3 0 2.4rem,#D9E4EC 2.4rem calc(2.4rem + 1px))}
.memo-line{font-size:1.35rem;font-weight:700;line-height:2.4rem;height:2.4rem}
.memo-line::before{content:"・"}
.explain{padding:14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.explain.ok b{color:var(--good)} .explain.ng b{color:var(--bad)}

/* result */
.score-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 22px}
.score-big{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:4rem;line-height:1;font-variant-numeric:tabular-nums}
.score-big small{font-size:1.4rem;color:var(--muted)}
.pill{display:inline-block;padding:.25rem 1rem;border-radius:999px;font-weight:700;font-size:1.05rem}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.mild{background:var(--mild-soft);color:var(--mild)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.doms{display:grid;gap:14px}
.dom{display:grid;grid-template-columns:7.5rem 1fr 3.6rem;gap:10px;align-items:center}
.dom-name{font-weight:700}
.dom-name small{display:block;font-weight:400;font-size:.78rem;color:var(--muted);line-height:1.4}
.dom-val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.dom .bar{height:14px}
.dom.low .bar i{background:var(--warn)}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:.8rem;text-align:center}
.scale div{padding:6px 2px;border-radius:8px}
.scale .on{outline:2px solid var(--ink)}
.disclaimer{font-size:.9rem;color:var(--muted);border-left:4px solid var(--line);padding:4px 0 4px 14px}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:10px}
.tip{padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.tip b{display:block;font-family:"Zen Maru Gothic",sans-serif;font-size:1.05rem;margin-bottom:2px}
.tip span{font-size:.9rem;color:var(--muted)}

/* records */
.chart svg{width:100%;height:auto;display:block}
.c-grid{stroke:var(--line);stroke-width:1}
.c-th{stroke:var(--muted);stroke-width:1;stroke-dasharray:5 5}
.c-lbl{fill:var(--muted);font-size:13px;font-family:"BIZ UDPGothic",sans-serif}
.c-line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.c-area{fill:var(--accent-soft);opacity:.7}
.c-pt{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.c-pt.last{fill:var(--accent)}
.c-val{fill:var(--ink);font-size:14px;font-weight:700;font-family:"BIZ UDPGothic",sans-serif}
.c-band{fill:var(--good-soft);opacity:.6}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.82rem;color:var(--muted);font-weight:700}
td.num{text-align:right}
.sample-flag{font-size:.82rem;color:var(--gold);font-weight:700}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.92rem;padding:8px}
.danger{color:var(--bad)}

@media (max-width:480px){
  .hero h1{font-size:1.6rem}
  .q{font-size:1.25rem}
  .dom{grid-template-columns:6.2rem 1fr 3.2rem}
  .task{padding:18px 14px}
  .score-big{font-size:3.3rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function orient(){
  const now=new Date(),Y=now.getFullYear(),M=now.getMonth()+1,D=now.getDate(),W=now.getDay();
  const season=M>=3&&M<=5?'春':M>=6&&M<=8?'夏':M>=9&&M<=11?'秋':'冬';
  const Q=[
    {q:'今年は西暦何年ですか？',opts:shuffle([Y-2,Y-1,Y,Y+1]).map(y=>({v:String(y),t:y+'年'})),ans:String(Y)},
    {q:'今は何月ですか？',cls:'grid4',opts:[...Array(12)].map((_,i)=>({v:String(i+1),t:(i+1)+'月'})),ans:String(M)},
    {q:'今日は何日ですか？',pad:true,ans:String(D)},
    {q:'今日は何曜日ですか？',cls:'grid4',opts:DAY.map((d,i)=>({v:String(i),t:d+'曜日'})),ans:String(W)},
    {q:'今の季節はどれですか？',opts:['春','夏','秋','冬'].map(s=>({v:s,t:s})),ans:season},
  ];
  testing=true;T.s.orient=0;let i=0;
  const ask=()=>{
    const q=Q[i];
    const next=v=>{if(v===q.ans)T.s.orient++;i++;i<Q.length?ask():memorize()};
    const sub=`カレンダーや時計を見ずに答えてください（${i+1} / 5）`;
    if(q.pad)padScreen({head:prog(0),sub,q:q.q,unit:'日',maxLen:2,onEnter:v=>next(String(parseInt(v,10))),foot:quitLink()});
    else screen(`${prog(0)}<div class="task"><p class="qsub">${sub}</p><h2 class="q">${q.q}</h2><div class="choices ${q.cls||''}">${q.opts.map(o=>`<button class="btn choice" data-a="p" data-v="${o.v}">${o.t}</button>`).join('')}</div></div>${quitLink()}`,{p:next});
  };
  ask();
}

  every(()=>{left--;const tl=$('#tl');if(tl){tl.textContent=`あと ${Math.max(left,0)} 秒`;$('#tb').style.width=Math.max(0,left/sec*100)+'%'}if(left<=0)next()},1000);
}

function calc(){
  T.s.calc=0;let prev=100,i=0;
  const ask=()=>padScreen({head:prog(2),sub:`${i+1} / 5 問目`,q:i===0?'100 から 7 を引くと、いくつですか？':'そこから、さらに 7 を引くと、いくつですか？',
    extra:i>0?'<p class="note">前の答えは表示されません。頭の中で覚えておいてください。</p>':'',maxLen:3,foot:quitLink(),
    onEnter:v=>{const n=parseInt(v,10);if(n===prev-7)T.s.calc++;prev=n;i++;i<5?ask():digits()}});
  ask();
}

function digits(){
  T.s.dig=0;const lens=[3,4];let li=0;
  const intro=()=>screen(`${prog(3)}<div class="task"><p class="qsub">${li+1} / 2 問目（${lens[li]}けた）</p><h2 class="q">数字が1つずつ出ます。終わったら<u>逆の順番</u>で入力してください。</h2><p class="note">例：「2・8・5」と出たら「5・8・2」と入力します。</p><button class="btn primary wide" data-a="go">数字を見る</button></div>${quitLink()}`,{go:show});
  const show=()=>{
    const seq=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,lens[li]).map(String);let k=0;
    screen(`${prog(3)}<div class="task center"><p class="qsub">よく見てください</p><div class="flash" id="fl" aria-live="assertive"></div></div>`);
    const step=()=>{const f=$('#fl');if(!f)return;if(k<seq.length){f.textContent=seq[k];f.classList.add('on');later(()=>{f.classList.remove('on');f.textContent='';k++;later(step,350)},1000)}else ask(seq)};
    later(step,700);
  };
  const ask=seq=>padScreen({head:prog(3),sub:`${seq.length}けたの数字`,q:'逆の順番で入力してください',maxLen:seq.length,foot:quitLink(),
    onEnter:v=>{const ok=v===seq.slice().reverse().join('');if(ok)T.s.dig++;li++;if(ok&&li<lens.length)intro();else clock()}});
  intro();
}

function clockSVG(h,m){
  let s='<svg viewBox="0 0 200 200" role="img" aria-label="アナログ時計"><circle class="ck-face" cx="100" cy="100" r="92"/>';
  for(let i=0;i<60;i++){const a=i*6*Math.PI/180,big=i%5===0,r1=big?80:84;s+=`<line class="ck-tick${big?' big':''}" x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+88*Math.sin(a)}" y2="${100-88*Math.cos(a)}"/>`}
  for(let n=1;n<=12;n++){const a=n*30*Math.PI/180;s+=`<text class="ck-num" x="${100+66*Math.sin(a)}" y="${100-66*Math.cos(a)+6}" text-anchor="middle">${n}</text>`}
  const ha=((h%12)+m/60)*30*Math.PI/180,ma=m*6*Math.PI/180;
  s+=`<line class="ck-h" x1="100" y1="100" x2="${100+40*Math.sin(ha)}" y2="${100-40*Math.cos(ha)}"/><line class="ck-m" x1="100" y1="100" x2="${100+60*Math.sin(ma)}" y2="${100-60*Math.cos(ma)}"/><circle class="ck-c" cx="100" cy="100" r="5"/></svg>`;
  return s;
}
function makeClockItems(n){
  const mins=[10,15,20,25,35,40,50],out=[];
  while(out.length<n){
    const h=1+rand(12),m=mins[rand(mins.length)];if(out.some(o=>o.h===h))continue;
    const c=[];const add=(hh,mm)=>{hh=((hh-1+24)%12)+1;if(mm<=0||mm>=60)return;if(hh===h&&mm===m)return;if(c.some(x=>x.h===hh&&x.m===mm))return;c.push({h:hh,m:mm})};
    add(m/5,h*5);add(h+1,m);add(h,(m+30)%60);add(h-1,m);add(h,60-m);
    out.push({h,m,opts:shuffle([{h,m,ok:true},...c.slice(0,3)])});
  }
  return out;
}
function clock(){
  T.s.vis=0;const items=makeClockItems(2);let i=0;
  const ask=()=>{const it=items[i];
    screen(`${prog(4)}<div class="task"><p class="qsub">${i+1} / 2 問目</p><h2 class="q">この時計は何時何分を指していますか？</h2><div class="clock-wrap">${clockSVG(it.h,it.m)}</div><div class="choices grid2">${it.opts.map((o,j)=>`<button class="btn choice" data-a="p" data-v="${j}">${o.h}時${o.m}分</button>`).join('')}</div></div>${quitLink()}`,

function placeDots(N){
  for(let tries=0;tries<200;tries++){
    const p=[];let guard=0;
    while(p.length<N&&guard<3000){guard++;const x=10+Math.random()*80,y=10+Math.random()*80;if(p.every(q=>Math.hypot(q.x-x,q.y-y)>19))p.push({x,y})}
    if(p.length===N)return p;
  }
  return [...Array(N)].map((_,i)=>({x:14+(i%4)*24,y:14+Math.floor(i/4)*24}));
}
function trail(){
  const N=12,pos=placeDots(N);let next=1,errs=0,t0=0;
  const finish=()=>{const sec=(performance.now()-t0)/1000;let s=sec<=40?3:sec<=70?2:sec<=110?1:0;if(errs>=3)s=Math.max(0,s-1);T.s.trail=s;T.trailSec=sec;T.trailErr=errs;clearTimers();later(fluency,500)};
  const play=()=>{

      {d:(v,b)=>{v=+v;if(v===next){b.classList.add('done');b.disabled=true;next++;$('#nx').textContent=next<=N?next:'—';if(next>N)finish()}else if(v>next){errs++;shake(b)}},
       skip:()=>{T.s.trail=0;T.trailSec=null;fluency()}});

function chartSVG(data){
  const W=640,H=250,pl=34,pr=18,pt=18,pb=34,n=data.length;
  const x=i=>n===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(n-1),y=v=>pt+(30-v)/30*(H-pt-pb);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="チェック得点の推移"><rect class="c-band" x="${pl}" y="${y(30)}" width="${W-pl-pr}" height="${y(27)-y(30)}"/>`;
  [0,10,20,30].forEach(v=>{s+=`<line class="c-grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="c-lbl" x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
  [[24,'24 やや注意'],[27,'27 良好']].forEach(([v,t])=>{s+=`<line class="c-th" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="c-lbl" x="${W-pr-4}" y="${y(v)-5}" text-anchor="end">${t}</text>`});
  const pts=data.map((d,i)=>[x(i),y(d.total)]);
  if(n>1){s+=`<path class="c-area" d="M${pts[0][0]},${y(0)} L${pts.map(p=>p.join(',')).join(' L')} L${pts[n-1][0]},${y(0)} Z"/><path class="c-line" d="M${pts.map(p=>p.join(',')).join(' L')}"/>`}
  data.forEach((d,i)=>{s+=`<circle class="c-pt${i===n-1?' last':''}" cx="${pts[i][0]}" cy="${pts[i][1]}" r="${i===n-1?7:5}"/><text class="c-lbl" x="${pts[i][0]}" y="${H-10}" text-anchor="middle">${d.lbl}</text>`;
    if(i===n-1||n<=6)s+=`<text class="c-val" x="${pts[i][0]}" y="${pts[i][1]-13}" text-anchor="middle">${d.total}</text>`});
  return s+'</svg>';
}

  setNav('record');
  const t=store.tests,sample=!t.length;
  const data=sample?[{total:25,lbl:'例 1回目'},{total:26,lbl:'例 2回目'},{total:27,lbl:'例 3回目'}]:t.slice(-12).map(r=>({total:r.total,lbl:md(r.date)}));
  const trainRows=GAMES.map(g=>{const l=store.train[g.id]||[];if(!l.length)return '';const last=l[l.length-1];const b=bestOf(g.id,last.lv);
    return `<tr><td>${g.name}</td><td class="num">${l.length}回</td><td>${md(last.date)}　${g.levels[last.lv].replace(/（.*）/,'')}・${last.label}</td><td>${b.label}</td></tr>`}).join('');
  let armed=false;
  screen(`<section class="hero" style="margin-top:0"><p class="eyebrow">記録</p><h1>チェック得点の推移</h1><p class="lead">いま表示しているのは「<b>${esc(pname(people.cur))}</b>」の記録です。記録はこの端末のブラウザの中だけに保存されます。同じ端末・同じブラウザで続けてください。</p></section>
  <div class="card chart">${sample?'<p class="sample-flag">サンプル表示：まだ記録がないため、表示例を出しています</p>':''}${chartSVG(data)}</div>
  ${t.length?`<section><h2>チェックの履歴</h2><div class="card tbl-wrap"><table><thead><tr><th>日付</th><th>合計</th><th>判定</th>${DOMS.map(d=>`<th>${d.n}</th>`).join('')}<th></th></tr></thead><tbody>
    ${t.map((r,i)=>({r,i})).reverse().map(({r,i})=>`<tr><td>${fmtDate(r.date)}</td><td class="num"><b>${r.total}</b></td><td><span class="pill ${levelOf(r.total).c}" style="font-size:.8rem;padding:.05rem .6rem">${levelOf(r.total).n}</span></td>${DOMS.map(d=>`<td class="num">${r.dom[d.k]}/${d.max}</td>`).join('')}<td><button class="link" data-a="open" data-v="${i}">詳細</button></td></tr>`).join('')}
  </tbody></table></div></section>`:''}
  <section><h2>脳トレの記録</h2>${trainRows?`<div class="card tbl-wrap"><table><thead><tr><th>種類</th><th>回数</th><th>最新</th><th>自己ベスト（同じ難しさ）</th></tr></thead><tbody>${trainRows}</tbody></table></div>`:'<p class="note">まだ脳トレの記録がありません。</p>'}</section>
  ${(t.length||trainRows)?'<p style="margin-top:28px"><button class="link danger" data-a="clear" id="clr">記録をすべて消す</button></p>':''}`,
  {open:v=>resultView(t[+v],false),
   clear:(v,b)=>{if(!armed){armed=true;b.textContent='本当に消す場合は、もう一度押してください';return}store.tests=[];store.train={};save();record()}});
}

/* ---------- 使う人の切り替え ---------- */
function who(){
  setNav('');
  let editing=-1;
  const draw=()=>{
    screen(`<section class="hero" style="margin-top:0"><p class="eyebrow">使う人</p><h1>使う人を切り替える</h1><p class="lead">3人まで、記録を人ごとに分けて残せます。チェックや脳トレの前に、ご自分の名前になっているか確かめてください。</p></section>
    <div style="display:grid;gap:14px">${[0,1,2].map(i=>{const d=i===people.cur?store:load(i),n=d.tests.length,last=d.tests[n-1];
      return `<div class="card who-card${i===people.cur?' cur':''}"><div class="who-name">${esc(pname(i))}</div>
      <p class="note">${n?`チェック ${n}回・前回 ${fmtDate(last.date)}`:'チェックの記録はまだありません'}</p>
      ${editing===i?`<div class="who-edit"><input id="nm" data-i="${i}" maxlength="10" value="${esc(people.names[i])}" placeholder="${i+1}人目" aria-label="名前"><button class="btn primary" data-a="nmok" data-v="${i}">名前を保存</button></div>`
      :`<div class="row">${i===people.cur?'<span class="pill good">いま使っています</span>':`<button class="btn primary" data-a="use" data-v="${i}">この人に切り替える</button>`}<button class="link" data-a="nmed" data-v="${i}">名前を変える</button></div>`}</div>`}).join('')}</div>
    <p class="note" style="margin-top:20px">名前はこの端末の中だけに保存されます。</p>`,{
      use:v=>{const fs=store.fs;people.cur=+v;savePeople();store=load(+v,fs);applyFs();applyWho();home()},
      nmed:v=>{editing=+v;draw();const el=$('#nm');if(el)el.focus()},
      nmok:v=>{people.names[+v]=($('#nm').value||'').trim().slice(0,10);savePeople();applyWho();editing=-1;draw()},
    });
  };
  draw();
}

home();
</script>
</body>
</html>
